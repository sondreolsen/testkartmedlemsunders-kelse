<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NHO Medlemsundersøkelsen mai 2026</title>
    <link rel="stylesheet" href="styles.css?v=10">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>NHOs MEDLEMSUNDERSØKELSE</h1>
      </div>
      <div class="stamp">
        <span>Mai 2026</span>
        <strong>28.04-06.05</strong>
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="metrics" aria-label="Nøkkeltall">
          <div class="metric-card positive">
            <span class="metric-icon" aria-hidden="true"></span>
            <span>Beste nå</span>
            <strong id="bestNow">-</strong>
          </div>
          <div class="metric-card negative">
            <span class="metric-icon" aria-hidden="true"></span>
            <span>Svakest nå</span>
            <strong id="worstNow">-</strong>
          </div>
          <div class="metric-card positive">
            <span class="metric-icon" aria-hidden="true"></span>
            <span>Beste utsikt</span>
            <strong id="bestOutlook">-</strong>
          </div>
          <div class="metric-card negative">
            <span class="metric-icon" aria-hidden="true"></span>
            <span>Dårlige utsikter</span>
            <strong id="worstOutlook">-</strong>
          </div>
        </div>
      </section>

      <section class="map-grid" aria-label="Fylkeskart">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Markedssituasjonen akkurat nå</h2>
            </div>
            <p class="formula">Netto: God - Dårlig</p>
          </div>
          <div class="map-wrap">
            <svg id="mapNow" class="norway-map" viewBox="0 0 520 720" role="img" aria-labelledby="mapNowTitle">
              <title id="mapNowTitle">Markedssituasjon per fylke</title>
            </svg>
          </div>
          <div class="legend">
            <span>Dårligere</span>
            <i></i>
            <span>Bedre</span>
          </div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Markedsutsikter neste 6 måneder</h2>
            </div>
            <p class="formula">Netto: Bedring - Forverring</p>
          </div>
          <div class="map-wrap">
            <svg id="mapOutlook" class="norway-map" viewBox="0 0 520 720" role="img" aria-labelledby="mapOutlookTitle">
              <title id="mapOutlookTitle">Markedsutsikter per fylke</title>
            </svg>
          </div>
          <div class="legend">
            <span>Dårligere</span>
            <i></i>
            <span>Bedre</span>
          </div>
        </article>
      </section>

    </main>

    <script src="script.js?v=6"></script>
  </body>
</html>
